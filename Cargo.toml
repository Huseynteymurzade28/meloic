[package]
name = "meloic"
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Huseynteymurzade28/meloic"
description = "A good-looking terminal music player with real album covers, waveform, queue and themes"
readme = "README.MD"
exclude = ["assets/", "demo-music/"]
keywords = ["music", "player", "tui", "terminal", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
rodio = { version = "0.19", features = ["symphonia-all"] }
ratatui = { version = "0.27.0", features = ["crossterm"] }
crossterm = "0.27.0"
walkdir = "2.3"
rand = "0.8"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
unicode-width = "0.1"
ratatui-image = { version = "1.0.5", default-features = false, features = ["crossterm", "rustix"] }
